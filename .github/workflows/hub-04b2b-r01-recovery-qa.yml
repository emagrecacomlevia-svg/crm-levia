name: HUB-04B2B-R01 Database Backup Restore Isolated QA

on:
  pull_request:
    paths:
      - ".github/workflows/hub-04b2b-r01-recovery-qa.yml"
      - "scripts/qa-database-recovery-r01.sh"
      - "docs/operations/DATABASE-BACKUP-PLAN.md"
      - "docs/operations/DATABASE-RESTORE-TEST.md"
      - "docs/security/BACKUP-ACCESS-AND-RETENTION.md"
      - "docs/delivery-reports/HUB-04B2B-R01.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-recovery:
    name: Pinned Supabase CLI 2.122.0 / PostgreSQL 17 / synthetic only
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      SUPABASE_ACCESS_TOKEN: ""
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and verify official pinned Supabase CLI 2.122.0
        shell: bash
        run: |
          set -Eeuo pipefail
          version=2.122.0
          base="https://github.com/supabase/cli/releases/download/v$version"
          asset=$(printf 'supabase_%s_linux_amd64.tar.gz' "$version")
          curl -fL --retry 3 "$base/$asset" -o "$asset"
          curl -fL --retry 3 "$base/checksums.txt" -o checksums.txt
          grep -F "$asset" checksums.txt | sha256sum -c -
          cli_dir=$(mktemp -d)
          tar -xzf "$asset" -C "$cli_dir" supabase
          sudo install -m 0755 "$cli_dir/supabase" /usr/local/bin/supabase
          rm -rf "$cli_dir"
          rm -f "$asset" checksums.txt
          test "$(supabase --version)" = "$version"
          supabase --version
      - name: Verify isolated CLI dump, restore, encryption, and negative tests
        shell: bash
        run: bash scripts/qa-database-recovery-r01.sh
