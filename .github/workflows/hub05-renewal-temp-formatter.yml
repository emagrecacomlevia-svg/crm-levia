name: HUB-05 Renewal Scoped Formatter (Temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/hub-05-integrated-catalog-20261027'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/hub-05-integrated-catalog-20261027
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - name: Format only new renewal source
        run: ./node_modules/.bin/prettier --write supabase/functions/hub-catalog-renew-approve/handler.ts supabase/tests/hub05_renewal_edge.test.ts docs/operations/HUB-05-EXCEPTIONAL-RENEWAL.md
      - name: Push strictly scoped changes
        run: |
          git add supabase/functions/hub-catalog-renew-approve/handler.ts supabase/tests/hub05_renewal_edge.test.ts docs/operations/HUB-05-EXCEPTIONAL-RENEWAL.md
          if ! git diff --cached --quiet; then
            git config user.name "LEVIA HUB CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "style(hub-05): normalize renewal handler, test and documentation"
            git push origin HEAD:refs/heads/dev/hub-05-integrated-catalog-20261027
          fi
