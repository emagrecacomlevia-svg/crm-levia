name: HUB-05 One-shot Tests Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/hub-05-integrated-catalog-20261027'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/hub-05-integrated-catalog-20261027
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - name: Format HUB-05 test source only
        run: |
          ./node_modules/.bin/prettier --write supabase/tests/hub05_edge_handlers.test.ts src/test/catalog-persistent.test.ts src/test/app-routing.test.tsx
      - name: Commit exact test format corrections
        run: |
          git add supabase/tests/hub05_edge_handlers.test.ts src/test/catalog-persistent.test.ts src/test/app-routing.test.tsx
          if ! git diff --cached --quiet; then
            git config user.name "LEVIA HUB CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "style(hub-05): format Edge, routing and persistence tests"
            git push origin HEAD:refs/heads/dev/hub-05-integrated-catalog-20261027
          fi
