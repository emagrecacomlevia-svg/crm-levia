name: HUB-05 Temporary Code Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/hub-05-integrated-catalog-20261027'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/hub-05-integrated-catalog-20261027
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - name: Format HUB-05 new source only
        run: |
          ./node_modules/.bin/prettier --write \
            src/modules/identity/auth.functions.ts \
            src/modules/identity/domain/permissions.ts \
            src/modules/core/catalog/persistent.ts \
            src/modules/core/catalog/catalog.functions.ts \
            src/modules/core/catalog/catalog-workspace.tsx \
            src/routes/app.catalog.tsx \
            src/test/identity-policy.test.ts \
            src/app/config/admin-navigation.ts \
            src/app/layouts/admin-navigation.tsx \
            supabase/functions/hub-authorize/handler.ts \
            supabase/functions/hub-admin-write/handler.ts \
            supabase/functions/hub-catalog/handler.ts
      - name: Commit scoped format changes
        run: |
          git add src/modules/identity/auth.functions.ts src/modules/identity/domain/permissions.ts \
            src/modules/core/catalog/persistent.ts src/modules/core/catalog/catalog.functions.ts \
            src/modules/core/catalog/catalog-workspace.tsx src/routes/app.catalog.tsx \
            src/test/identity-policy.test.ts src/app/config/admin-navigation.ts \
            src/app/layouts/admin-navigation.tsx supabase/functions/hub-authorize/handler.ts \
            supabase/functions/hub-admin-write/handler.ts supabase/functions/hub-catalog/handler.ts
          if ! git diff --cached --quiet; then
            git config user.name "LEVIA HUB CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "style(hub-05): normalize authenticated catalog source formatting"
            git push origin HEAD:refs/heads/dev/hub-05-integrated-catalog-20261027
          fi
