name: HUB-04 Scoped Formatter (Writer)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/hub-04-authz-at040-20261025'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/hub-04-authz-at040-20261025
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - name: Format only isolated writer
        run: ./node_modules/.bin/prettier --write supabase/functions/hub-admin-write/index.ts docs/delivery-reports/HUB-04-DEV2-AUTHORIZATION-PROVISORIA.md .github/workflows/hub04-deno-qa.yml
      - name: Commit scoped formatting
        run: |
          git add supabase/functions/hub-admin-write/index.ts docs/delivery-reports/HUB-04-DEV2-AUTHORIZATION-PROVISORIA.md .github/workflows/hub04-deno-qa.yml
          if ! git diff --cached --quiet; then
            git config user.name "LEVIA HUB CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "style(hub-04): format private audited writer"
            git push origin HEAD:refs/heads/dev/hub-04-authz-at040-20261025
          fi
