name: HUB-04 Scoped Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/hub-04-authz-at040-20261025'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/hub-04-authz-at040-20261025
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - name: Format only HUB-04 development source
        run: |
          ./node_modules/.bin/prettier --write \
            src/modules/identity/auth.functions.ts \
            src/modules/identity/server/auth-api.server.ts \
            src/modules/identity/server/authorization-api.server.ts \
            src/routes/app.tsx \
            src/routes/app.crm.tsx \
            src/routes/app.core.tsx \
            src/routes/app.social-studio.tsx \
            src/test/identity-authorization-api.test.ts \
            supabase/functions/hub-authorize/index.ts
      - name: Commit formatting on isolated branch
        run: |
          git add src/modules/identity src/routes/app.tsx src/routes/app.crm.tsx src/routes/app.core.tsx src/routes/app.social-studio.tsx src/test/identity-authorization-api.test.ts supabase/functions/hub-authorize/index.ts
          if ! git diff --cached --quiet; then
            git config user.name "LEVIA HUB CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "style(hub-04): format authorization implementation"
            git push origin HEAD:refs/heads/dev/hub-04-authz-at040-20261025
          fi
