name: HUB-05 One-off Gate Documentation Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  formatting:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/hub-05-integrated-catalog-20261027'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/hub-05-integrated-catalog-20261027
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/prettier --write docs/operations/HUB-05-INITIAL-CATALOG-GRANTS.md scripts/qa-hub05-authenticated.mjs
      - name: Commit scoped formatted files
        run: |
          git add docs/operations/HUB-05-INITIAL-CATALOG-GRANTS.md scripts/qa-hub05-authenticated.mjs
          if ! git diff --cached --quiet; then
            git config user.name "LEVIA HUB CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "style(hub-05): format exceptional grant operations and gated QA"
            git push origin HEAD:refs/heads/dev/hub-05-integrated-catalog-20261027
          fi
