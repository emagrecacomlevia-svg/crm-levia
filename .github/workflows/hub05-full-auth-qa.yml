name: HUB-05 Full Auth Integration PostgreSQL 17
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PG17 without network
        run: |
          docker run --rm -d --name hub05-full-pg --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 1 40); do docker exec hub05-full-pg pg_isready -U postgres && exit 0; sleep 2; done
          exit 1
      - name: Apply existing and new migrations and assert Auth scope and rollback
        run: |
          docker exec -i hub05-full-pg psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users(id uuid primary key,banned_until timestamptz,deleted_at timestamptz,is_anonymous boolean default false,raw_app_meta_data jsonb default '{}');
          create table auth.sessions(id uuid primary key,user_id uuid references auth.users(id) on delete cascade,created_at timestamptz default now(),not_after timestamptz);
          SQL
          for file in supabase/migrations/*.sql; do
            docker exec -i hub05-full-pg psql -U postgres -v ON_ERROR_STOP=1 < "$file"
          done
          docker exec -i hub05-full-pg psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/hub05_authorization.sql
      - name: Cleanup
        if: always()
        run: docker rm -f hub05-full-pg || true
