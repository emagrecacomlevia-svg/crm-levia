name: HUB-04 Isolated Test Formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/hub-04-authz-at040-20261025'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/hub-04-authz-at040-20261025
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - name: Format only new Edge contract test
        run: ./node_modules/.bin/prettier --write supabase/tests/hub04_edge_handlers.test.ts
      - name: Commit strictly scoped formatting
        run: |
          git add supabase/tests/hub04_edge_handlers.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "LEVIA HUB CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "style(hub-04): format isolated Edge contract tests"
            git push origin HEAD:refs/heads/dev/hub-04-authz-at040-20261025
          fi
