name: HUB-03 Browser QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    name: Browser navigation · responsive · screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Setup Node for browser driver
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies (Bun frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright only in ephemeral runner temp directory
        run: |
          mkdir -p "$RUNNER_TEMP/levia-qa"
          npm install --prefix "$RUNNER_TEMP/levia-qa" --package-lock=false --ignore-scripts --no-audit --no-fund --save=false playwright@1.56.1
          node "$RUNNER_TEMP/levia-qa/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Start loopback-only development server
        run: |
          bun run dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/levia-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/levia-server.pid"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/levia-server.log"
          exit 1

      - name: Navigate and capture Chromium evidence
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: |
          QA_PLAYWRIGHT="$RUNNER_TEMP/levia-qa/node_modules/playwright" node scripts/qa-browser.cjs

      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-03-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: warn
          retention-days: 14

      - name: Show server logs if QA fails
        if: failure()
        run: cat "$RUNNER_TEMP/levia-server.log" || true
