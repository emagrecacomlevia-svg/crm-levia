name: LEVIA HUB Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Format · Build · Types · Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Verify corrected files format and show any diff
        run: |
          ./node_modules/.bin/prettier src/styles.css | diff -u src/styles.css -
          ./node_modules/.bin/prettier docs/delivery-reports/HUB-02.md | diff -u docs/delivery-reports/HUB-02.md -
          ./node_modules/.bin/prettier docs/architecture/NAVIGATION.md | diff -u docs/architecture/NAVIGATION.md -
          ./node_modules/.bin/prettier README.md | diff -u README.md -

      - name: Check formatting
        run: bun run format:check

      # TanStack file-based routing generates routeTree.gen.ts during the Vite build.
      # Build first so typecheck and route-matching tests read the generated route registry.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and UI tests
        run: bun run test
