name: LEVIA HUB Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Format · Build · Types · Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependency vulnerabilities
        run: bun audit

      - name: Lint
        run: bun run lint

      - name: Verify corrected files format and show any diff
        run: |
          ./node_modules/.bin/prettier src/styles.css | diff -u src/styles.css -
          ./node_modules/.bin/prettier docs/delivery-reports/HUB-02.md | diff -u docs/delivery-reports/HUB-02.md -
          ./node_modules/.bin/prettier docs/architecture/NAVIGATION.md | diff -u docs/architecture/NAVIGATION.md -
          ./node_modules/.bin/prettier README.md | diff -u README.md -
          ./node_modules/.bin/prettier docs/architecture/DATABASE-SCHEMA.md | diff -u docs/architecture/DATABASE-SCHEMA.md -

      - name: Check formatting
        run: bun run format:check

      # Verify a clean checkout contains no stale tracked generated route manifest.
      - name: Confirm generated route tree is absent in clean checkout
        run: test ! -e src/routeTree.gen.ts

      - name: Build and generate routes
        run: bun run build

      - name: Verify the five generated paths
        run: |
          test -f src/routeTree.gen.ts
          for route in "'/'" "'/app'" "'/app/social-studio'" "'/app/crm'" "'/app/core'"; do
            grep -Fq "$route" src/routeTree.gen.ts
          done

      - name: Typecheck
        run: bun run typecheck:generated

      - name: Unit and UI tests
        run: bun run test:generated
